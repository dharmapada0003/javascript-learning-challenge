<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Events in JavaScript</title>
  </head>
  <body>
    <button id="clickButton">Click Me</button><br /><br />

    <button id="doubleClickButton">Double Click Me</button><br />

    <h2 id="mouseOverHeading">Move mouse over me</h2>
    <br /><br />
    <div id="mouseOut"></div>
    <br />
    <button id="mouseDownButton">Press Me</button><br /><br />

    <button id="mouseUpButton">Release Me</button><br /><br />

    <div id="mouseEnterBox">Move your mouse here</div>
    <br /><br />

    <div id="mouseLeaveBox">Move your mouse away</div>
    <br /><br />

    <div id="mouseMoveBox">Move your mouse here</div>
    <br />

    <p id="contextMenuText">Right Click Me</p>
    <br />

    <input id="keyDownInput" placeholder="Press a key" /><br /><br />

    <input id="keyUpInput" placeholder="Release a key" /><br /><br />

    <input id="inputField" placeholder="Type something" /><br />

    <p id="inputResult"></p>
    <br />

    <select id="changeSelect">
      <option>Red</option>
      <option>Blue</option>
      <option>Green</option></select
    ><br /><br />

    <form id="submitForm">
      <input type="text" placeholder="Enter your name" />
      <button type="submit">Submit</button>
    </form>
    <br /><br />

    <form id="resetForm">
      <input type="text" placeholder="Enter your name" />

      <button type="reset">Reset</button>
    </form>
    <br /><br />

    <input id="focusInput" placeholder="Click here" /><br /><br />

    <input id="blurInput" placeholder="Click me" /><br /><br />

    <div id="focusInBox">
      <input placeholder="Click here" />
    </div>
    <br /><br />

    <div id="focusOutBox">
      <input placeholder="Click Me" />
    </div>
    <br /><br />

    <input id="copyInput" value="Copy this text" /><br /><br />

    <input id="cutInput" value="Cut this text" /><br /><br />

    <input id="pasteInput" placeholder="Paste something" />

    <!-- Common Event Object Properties and Methods -->
    <h2>Event Object Properties and Methods</h2>
    <br />

    <button id="clickEventButton">Click Me</button><br /><br />

    <button id="targetButton">Click Me</button>

    <script src="/13-events/events.js"></script>
    <script src="/13-events/event-object.js"></script>
  </body>
</html>

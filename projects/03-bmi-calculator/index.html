<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>BMI Calculator</title>
  </head>
  <body>
    <h2>BMI Calculator</h2>
    <div class="container">
      <form action="">
        <p class="para">
          <label for="">Enter Weight in KG</label>:
          <input type="text" id="weight" class="input" />
        </p>

        <p class="para">
          <label for="">Enter Height in CM</label>:
          <input type="text" id="height" class="input" />
        </p>

        <button type="submit" id="btn">Calculate</button>
      </form>

      <div id="result"></div>
      <div id="yourRange"></div>

      <h3>BMI Weight Guide</h3>
      <p class="guide">Under Weight = Less than 18.6</p>
      <p class="guide">Normal Range = 18.6 and 24.9</p>
      <p class="guide">Over Weight = Greater than 24.9</p>
    </div>

    <script src="./app.js"></script>
  </body>
</html>

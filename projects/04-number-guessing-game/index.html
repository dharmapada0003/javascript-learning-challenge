<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Number Guessing Game</title>
  </head>
  <body>
    <h2>Number Guessing Game</h2>
    <form class="form">
      <p class="para">
        Guess a random number between 1 and 100. <br />
        You have 10 attempts to guess the right number.
      </p>
      <h3>Guess a number</h3>
      <input type="text" id="input" />
      <button id="btn">Submit Guess</button>
      <p class="para">The number you guessed is: <span id="lowHigh"></span></p>
      <p class="para">Previous Guesses : <span id="guesses"></span></p>
      <p class="para">
        Guesses Remaining: <span id="remainingGuesses">10</span>
      </p>
    </form>

    <script src="./app.js"></script>
  </body>
</html>
